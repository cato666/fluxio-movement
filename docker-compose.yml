services:
  db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movement}
      POSTGRES_USER: ${POSTGRES_USER:-movement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    environment: &app_environment
      APP_ENV: ${APP_ENV:-production}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      STORAGE_PATH: /data/storage
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-250}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_REASONING_ENABLED: ${AI_REASONING_ENABLED:-true}
      AI_REASONING_MODEL: ${AI_REASONING_MODEL:-gpt-5.6-terra}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      TRAINING_AI_ENABLED: ${TRAINING_AI_ENABLED:-true}
      TRAINING_AI_MODEL: ${TRAINING_AI_MODEL:-}
      TRAINING_VOICE_ENABLED: ${TRAINING_VOICE_ENABLED:-true}
      TRAINING_TRANSCRIPTION_MODEL: ${TRAINING_TRANSCRIPTION_MODEL:-gpt-transcribe}

      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-kapso}
      WHATSAPP_PUBLIC_NUMBER: ${WHATSAPP_PUBLIC_NUMBER:-}
      KAPSO_API_KEY: ${KAPSO_API_KEY:-}
      KAPSO_WEBHOOK_SECRET: ${KAPSO_WEBHOOK_SECRET:-}
      KAPSO_PHONE_NUMBER_ID: ${KAPSO_PHONE_NUMBER_ID:-}
      WHATSAPP_ENCRYPTION_KEY: ${WHATSAPP_ENCRYPTION_KEY:-}
      WHATSAPP_KEY_VERSION: ${WHATSAPP_KEY_VERSION:-1}
      WHATSAPP_ENCRYPTION_KEYS: ${WHATSAPP_ENCRYPTION_KEYS:-{}}
      PHONE_HASH_KEY: ${PHONE_HASH_KEY:-}
      WHATSAPP_OUTBOUND_UNIT_COST_USD: ${WHATSAPP_OUTBOUND_UNIT_COST_USD:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

    ports:
      - "${APP_PORT:-8000}:8000"

    volumes:
      - app_storage:/data/storage

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  whatsapp-worker:
    build: .
    restart: unless-stopped
    environment: *app_environment
    command:
      - /bin/sh
      - -c
      - 'if [ "$$WHATSAPP_ENABLED" = "true" ]; then exec python -m app.whatsapp.worker; else exec sleep infinity; fi'
    volumes:
      - app_storage:/data/storage
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  app_storage:
